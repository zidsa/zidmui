\* Bounds: 2 listeners, 2 once() calls, 3 dispatches. Raise them only if a
\* change adds behaviour that needs a longer sequence to show.
\* OnceRemoves = "listener" matches the code today. Set it to "wrapper" only
\* after once() removes its own wrapper.
CONSTANTS
  Listeners = {l1, l2}
  MaxOnce = 2
  MaxTriggers = 3
  OnceRemoves = "listener"
SPECIFICATION Spec
INVARIANTS TypeOK AtMostOnce OnceKeepsOn
